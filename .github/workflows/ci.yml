name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go build ./...
      - run: go test -race ./...

  # The Postgres store is the multi-node scale-out backend, but its conformance suite only runs
  # when TEST_POSTGRES_URL is set — and nothing set it, so the backend a scaled production deploy
  # would actually use was never executed in CI. memory/file/sqlite were covered; Postgres was
  # "a mechanical port" verified only by a compile-time interface assertion.
  postgres:
    name: store conformance (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tsengine_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go test -race ./internal/store/...
        env:
          TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/tsengine_test?sslmode=disable

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go vet ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build golangci-lint FROM SOURCE with the job's Go (install-mode: goinstall) so its
      # build-Go always matches the module — a prebuilt "latest" binary is built with an
      # older Go and refuses a module whose go directive is newer than its build-Go. Pin the
      # v1 line (the .golangci.yml is v1 format).
      #
      # THE GO VERSION IS PINNED TO THE MODULE'S OWN, NOT 'stable', AND THAT IS THE FIX.
      # Building golangci-lint with a Go NEWER than it understands breaks it from the other
      # direction: v1.64.8's vendored x/tools decodes export data up to version 2 (Go 1.26),
      # and Go 1.27 emits version 4. Every import then fails to load and the run collapses
      # into a wall of typecheck errors on valid code —
      #
      #   could not import sync/atomic (cannot decode "sync/atomic", export data version 4
      #   is greater than maximum supported version 2)
      #
      # which reads like the code is broken rather than the linter. This gate had been red on
      # main since Go 1.27 became 'stable', and while it was red it hid nine real issues,
      # including a test assertion that compared a pure function's output to itself and could
      # never fail. A permanently-red gate is not a strict gate; it is no gate, and the cost
      # is exactly the failures nobody sees.
      #
      # Pinning to the module's declared version is also the more correct thing on its own
      # terms: the linter should typecheck against the Go the module targets, not whatever is
      # newest. WHEN go.mod MOVES PAST 1.26 THIS BREAKS AGAIN — the real fix then is
      # golangci-lint v2 (the v1 line ends at 1.64.x), which needs .golangci.yml migrated to
      # the v2 format. Do that migration deliberately; do not bump this pin past what the
      # linter can decode.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          # Skip `golangci-lint config verify`. It validates .golangci.yml against a schema the
          # action FETCHES FROM golangci-lint.run at run time, so a job that otherwise needs no
          # network fails whenever that host is slow:
          #
          #   compile schema: failing loading ".../golangci.v1.64.jsonschema.json":
          #   context deadline exceeded
          #
          # That is a red X on an unrelated PR, and the cost is not the lost minute — it is that a
          # lint failure stops meaning anything. Once "lint is probably just flaky" is the reflex, a
          # real one gets waved through.
          #
          # Little is given up: golangci-lint still rejects an unknown key in .golangci.yml when it
          # actually runs, so a broken config fails the same job either way. `config verify` only
          # adds schema-level detail on a file that changes a couple of times a year.
          verify: false

  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
