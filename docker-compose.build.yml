# docker-compose.build.yml — build the images locally instead of pulling them.
#
# docker-compose.prod.yml PULLS published images, because a VM should not be compiling Go and
# building a Next.js bundle before it can serve a request. This override restores the old behaviour
# for the cases that genuinely need it: developing against uncommitted changes, an air-gapped
# install, or a fork that does not publish to this registry.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.build.yml up -d --build
#
# The sandbox image is NOT here — it is not a compose service. Build it with `make sandbox-image`
# (or `make sandbox-image-dev TOOLSET=repository,web` for a slim one) and point
# TSENGINE_SANDBOX_IMAGE at the local tag.

services:
  platform:
    build:
      context: .
      dockerfile: docker/platform/Dockerfile

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* must be BUILD args — Next.js inlines them into the bundle at build time, so
      # runtime env cannot set them. Without these a locally-built site publishes canonical/sitemap
      # URLs for the placeholder domain and legal documents with no named entity or jurisdiction.
      # (A PULLED image already carries them: CI passes the same values from repo variables.)
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://${TSENGINE_SITE_ADDRESS:-localhost}}
        NEXT_PUBLIC_LEGAL_ENTITY: ${NEXT_PUBLIC_LEGAL_ENTITY:-}
        NEXT_PUBLIC_LEGAL_JURISDICTION_CITY: ${NEXT_PUBLIC_LEGAL_JURISDICTION_CITY:-}
        NEXT_PUBLIC_LEGAL_COUNTRY: ${NEXT_PUBLIC_LEGAL_COUNTRY:-India}
        NEXT_PUBLIC_LEGAL_ADDRESS: ${NEXT_PUBLIC_LEGAL_ADDRESS:-}
        NEXT_PUBLIC_SMTP_SUBPROCESSOR: ${NEXT_PUBLIC_SMTP_SUBPROCESSOR:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_CONTACT_PHONE: ${NEXT_PUBLIC_CONTACT_PHONE:-}
        NEXT_PUBLIC_CONTACT_PHONE_TEL: ${NEXT_PUBLIC_CONTACT_PHONE_TEL:-}
        NEXT_PUBLIC_PRIVACY_EMAIL: ${NEXT_PUBLIC_PRIVACY_EMAIL:-}
        NEXT_PUBLIC_SECURITY_EMAIL: ${NEXT_PUBLIC_SECURITY_EMAIL:-}
        NEXT_PUBLIC_LEGAL_EMAIL: ${NEXT_PUBLIC_LEGAL_EMAIL:-}
